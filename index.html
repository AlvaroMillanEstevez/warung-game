<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#315e50" />
    <meta name="description" content="Warung Kita: prepara nasi goreng en tu pequeño restaurante. Prototipo de producción manual." />
    <link rel="icon" href="data:," />
    <title>Warung Kita · Tu pequeño restaurante</title>
  </head>
  <body>
    <main class="app">
      <div id="game" tabindex="0" role="application" aria-label="Restaurante. Muévete con WASD, flechas o arrastrando. Quédate quieto junto a las estaciones para actuar."></div>
      <div class="hud" aria-label="Estado del restaurante">
        <header class="hud-heading">
          <h1>warung kita<span>.</span></h1>
          <button id="reset-test" data-ui type="button" title="Herramienta provisional: vaciar producción, manos y mostrador y volver al inicio"><span>DEV · provisional</span>Reiniciar prueba</button>
        </header>
        <div class="status-strip">
          <div class="status-chip"><span>EN LAS MANOS</span><strong id="carried-status">Vacías</strong></div>
          <div class="status-chip"><span>HORNILLO</span><strong id="stove-status">Vacío</strong></div>
          <div class="status-chip"><span>MOSTRADOR</span><strong id="counter-status">0 / 5</strong></div>
        </div>
      </div>
      <div id="pause-notice" class="pause-notice" hidden>En pausa · vuelve al local para continuar</div>
      <div class="context" aria-live="polite" aria-atomic="true"><strong id="station-name">Tu primera tanda de nasi goreng</strong><p id="interaction-hint">Acércate al frigorífico y quédate quieto.</p></div>
      <p id="interaction-message" class="message" role="status" aria-live="polite" aria-atomic="true" hidden></p>
      <div id="drag-indicator" aria-hidden="true" hidden><span id="drag-knob"></span></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
