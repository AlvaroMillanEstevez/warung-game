<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#315e50" />
    <meta name="description" content="Warung Kita: prepara nasi goreng y cuida tu pequeño restaurante." />
    <link rel="icon" href="data:," />
    <title>Warung Kita · Tu pequeño restaurante</title>
  </head>
  <body>
    <main class="app">
      <div id="game" tabindex="0" role="application" aria-label="Restaurante. Muévete con WASD, flechas o arrastrando. Quédate quieto junto a las estaciones para actuar."></div>
      <div class="hud" aria-label="Restaurante">
        <button id="money-display" data-ui type="button" aria-label="Dinero disponible"><span aria-hidden="true">●</span> <strong id="money-status">0 monedas</strong></button>
      </div>
      <dialog id="upgrades-panel" data-ui aria-labelledby="upgrades-title">
        <header class="upgrades-heading"><div><h2 id="upgrades-title">Tu local, paso a paso</h2><p id="upgrade-money"></p></div><button id="close-upgrades" type="button">Cerrar</button></header>
        <p class="upgrades-intro">Mejoras · el restaurante está en pausa</p>
        <div id="upgrade-list"></div>
        <p id="upgrade-feedback" role="status" aria-live="polite"></p>
      </dialog>
      <dialog id="debug-panel" data-ui aria-labelledby="debug-title">
        <header class="upgrades-heading"><h2 id="debug-title">Pruebas de desarrollo</h2><button id="close-debug" type="button">Cerrar</button></header>
        <pre id="debug-state"></pre>
        <button id="reset-test" type="button">Reiniciar prueba</button>
      </dialog>
      <div id="pause-notice" class="pause-notice" hidden>En pausa · vuelve al local para continuar</div>
      <div id="drag-indicator" aria-hidden="true" hidden><span id="drag-knob"></span></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
